<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        do {
            let age = input("Enter the person's age: ");
            let isAdult = false;

            while (!isAdult) {
                age++;
                if (age >= 18) {
                    isAdult = true;
                }
            }
        } while (!isNaN(age) || age < 18);


        console.log("The person is now an adult.");
    </script>
</body>
</html>
